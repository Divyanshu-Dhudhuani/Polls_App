<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a New Poll</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html">&larr; Back to Home</a>
    </header>
    <main class="container">
        <h2>Create a New Poll</h2>

        <form id="poll-form">
            <div class="form-group">
                <label for="poll-question">Poll Question:</label>
                <input type="text" id="poll-question" placeholder="e.g., What is your favorite programming language?" required>
            </div>
            <div class="form-group">
                <label>Options:</label>
                <div id="options-container">
                    <input type="text" class="option-input" placeholder="Option 1" required>
                    <input type="text" class="option-input" placeholder="Option 2" required>
                </div>
                <button type="button" id="add-option-btn" class="btn">+ Add Option</button>
            </div>
            <button type="submit" class="btn btn-primary">Create Poll</button>
        </form>
    </main>
    <script src="script.js"></script>
</body>
</html>
